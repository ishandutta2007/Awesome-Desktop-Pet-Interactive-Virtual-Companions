<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E7E" />
      <stop offset="35%" stop-color="#FF99C8" />
      <stop offset="70%" stop-color="#70A6FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF5E7E" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatPet1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes floatPet2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(-4deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.55; }
    }
    @keyframes walkBounce {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-4px); }
      75% { transform: translateY(-2px); }
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
    .pet-bounce1 { animation: floatPet1 4.5s ease-in-out infinite; }
    .pet-bounce2 { animation: floatPet2 5.2s ease-in-out infinite; }
    .orb1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 7s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
    .walker { animation: walkBounce 1.2s ease-in-out infinite; }
    .heart { animation: heartBeat 2s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <g stroke="#30363d" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle class="orb1" cx="200" cy="120" r="160" fill="url(#glowGrad1)" />
  <circle class="orb2" cx="1020" cy="300" r="190" fill="url(#glowGrad2)" />

  <!-- Animated Companions & Badges in Background Layers -->
  <!-- Left Side: Interactive Tamagotchi / Virtual Pet Bubble -->
  <g class="pet-bounce1" transform="translate(70, 130)">
    <!-- Virtual Device Shell -->
    <rect x="0" y="0" width="130" height="150" rx="40" fill="#1e2430" stroke="#FF5E7E" stroke-width="2.5" />
    <rect x="18" y="24" width="94" height="74" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <!-- Pixel Mascot Inside Device -->
    <text x="65" y="65" font-size="34" text-anchor="middle" dominant-baseline="middle">🐱</text>
    <path class="heart" d="M 65 34 C 65 30, 60 27, 57 29 C 53 31, 53 37, 65 44 C 77 37, 77 31, 73 29 C 70 27, 65 30, 65 34 Z" fill="#FF5E7E" />
    <!-- Device Buttons -->
    <circle cx="38" cy="118" r="8" fill="#FF5E7E" />
    <circle cx="65" cy="124" r="8" fill="#70A6FF" />
    <circle cx="92" cy="118" r="8" fill="#00F0FF" />
    <text x="65" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#8b949e" text-anchor="middle" font-weight="600">TAMAGOTCHI</text>
  </g>

  <!-- Right Side: AI 3D Companion Live2D Avatar Card -->
  <g class="pet-bounce2" transform="translate(1000, 110)">
    <rect x="0" y="0" width="140" height="170" rx="18" fill="url(#cardGrad)" stroke="#00F0FF" stroke-width="2" />
    <rect x="12" y="14" width="116" height="96" rx="12" fill="#090d16" stroke="#30363d" stroke-width="1" />
    <text x="70" y="62" font-size="38" text-anchor="middle" dominant-baseline="middle">🦊</text>
    <rect x="24" y="120" width="92" height="18" rx="9" fill="#00f0ff22" stroke="#00f0ff" stroke-width="1" />
    <text x="70" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#00F0FF" text-anchor="middle" font-weight="700">AI LIVE-COMPANION</text>
    <circle cx="106" cy="24" r="4" fill="#00F0FF" />
    <text x="70" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">VRM / Live2D / STT</text>
  </g>

  <!-- Bottom Walking Screen Pets (Desktop Shelf) -->
  <g class="walker" transform="translate(480, 360)">
    <line x1="-350" y1="20" x2="350" y2="20" stroke="#30363d" stroke-width="2" stroke-dasharray="6,6" />
    <text x="-240" y="14" font-size="22">🐈</text>
    <text x="-120" y="14" font-size="22">🦆</text>
    <text x="0" y="14" font-size="22">👾</text>
    <text x="130" y="14" font-size="22">🦀</text>
    <text x="250" y="14" font-size="22">🐕</text>
  </g>

  <!-- FOREGROUND: Header, Title & Subtitles (Always Crisp and Guaranteed Legible) -->
  <g id="header-foreground">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#161b22" stroke="url(#accentGrad)" stroke-width="1.8" />
      <text x="0" y="5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="1.5">
        ✨ CURATED ECOSYSTEM &amp; RUNTIMES ✨
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="-0.5">
      Awesome Desktop Pets &amp; Virtual Companions
    </text>

    <!-- Secondary Tagline / Subtitle -->
    <text x="600" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="500" fill="#e6edf3" text-anchor="middle">
      Interactive Screen Mascots • Tamagotchi Runtimes • Live2D/VRM Avatars • Local AI Companions
    </text>

    <!-- Highlight Feature Pills (Floating cleanly in foreground) -->
    <g transform="translate(600, 246)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#1f242c" stroke="#30363d" stroke-width="1" />
        <text x="75" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#FF99C8" text-anchor="middle">🐾 Desktop Pets</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-155, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#1f242c" stroke="#30363d" stroke-width="1" />
        <text x="75" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#70A6FF" text-anchor="middle">🥚 Tamagotchi Sims</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#1f242c" stroke="#30363d" stroke-width="1" />
        <text x="75" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#00F0FF" text-anchor="middle">🎭 3D VRM &amp; Live2D</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#1f242c" stroke="#30363d" stroke-width="1" />
        <text x="75" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#3fb950" text-anchor="middle">🤖 Local-First AI</text>
      </g>
    </g>

    <!-- Supported Platforms Label -->
    <text x="600" y="315" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#8b949e" text-anchor="middle">
      Supported on Windows 🪟 • macOS 🍎 • Linux 🐧 • Web Browsers 🌐 • VS Code 💻
    </text>
  </g>
</svg>